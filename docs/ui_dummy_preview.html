<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent-01 UI Dummy Preview</title>
  <style>
    :root {
      --bg: #181818;
      --panel: #1f1f1f;
      --text: #d0d0d0;
      --muted: #8a8a8a;
      --lane: #38c172;
      --thinking: #d6b045;
      --error: #e05d5d;
      --code-bg: #262626;
      --code-fg: #c8c8c8;
      --input-bg: #202020;
      --btn-bg: #2a2a2a;
      --btn-bd: #3a3a3a;
      --accent: #38c172;
    }

    [data-theme="light"] {
      --bg: #eef2f7;
      --panel: #ffffff;
      --text: #2f2f2f;
      --muted: #6c727f;
      --lane: #1f7f3e;
      --thinking: #9a6700;
      --error: #c52b2b;
      --code-bg: #e8e8e8;
      --code-fg: #2f2f2f;
      --input-bg: #f7f9fc;
      --btn-bg: #f1f4f9;
      --btn-bd: #cfd7e6;
      --accent: #1f7f3e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Consolas", "Cascadia Mono", "Fira Code", monospace;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .wrap { width: min(1100px, 96vw); }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .controls input, .controls button {
      border: 1px solid var(--btn-bd);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .controls input { flex: 1 1 420px; }
    .controls button {
      background: var(--btn-bg);
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }
    .controls button:hover { transform: translateY(-1px); border-color: var(--accent); }

    .terminal {
      background: var(--panel);
      border: 1px solid #323232;
      border-radius: 14px;
      padding: 16px;
      min-height: 70vh;
      overflow: auto;
    }

    .banner { color: var(--lane); margin: 0; white-space: pre; }
    .version { color: var(--muted); margin: 0 0 10px 0; text-align: right; }
    .line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }
    .line > span, .line > div { min-width: 0; }
    .line + .line { margin-top: 2px; }
    .prompt, .branch {
      color: var(--lane);
      font-weight: 700;
      width: 26px;
      flex: 0 0 26px;
      display: inline-flex;
      align-self: stretch;
      align-items: flex-start;
    }
    .branch.processing { color: var(--lane); }
    .branch.thinking { color: var(--thinking); }
    .branch.success { color: var(--lane); }
    .branch.error { color: var(--error); }
    .status-text.processing { color: var(--muted); }
    .status-text.thinking { color: var(--muted); }
    .status-text.success { color: var(--lane); }
    .status-text.error { color: var(--error); }
    .dim { color: var(--muted); }
    .agent-label { color: var(--lane); font-weight: 700; }
    .tool-label { color: var(--thinking); }
    .tool-result { color: var(--muted); }
    .error { color: var(--error); }

    .md-row-wrap { margin-top: 2px; min-width: 0; width: 100%; }
    .md-row {
      min-height: 1.45em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .md-row.h1, .md-row.h2, .md-row.h3 { font-weight: 700; }
    .md-row.h1 { font-size: 1.2rem; text-transform: uppercase; }
    .md-row.h2 { font-size: 1.07rem; }
    .md-row.h3 { font-size: 1rem; }
    .md-row.quote {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      color: var(--muted);
    }
    .md-row.quote .qbar {
      color: var(--lane);
      font-weight: 700;
      display: inline-block;
      text-align: center;
    }
    .md-row-wrap.processing .md-row.quote .qbar { color: var(--lane); }
    .md-row-wrap.thinking .md-row.quote .qbar { color: var(--thinking); }
    .md-row-wrap.success .md-row.quote .qbar { color: var(--lane); }
    .md-row-wrap.error .md-row.quote .qbar { color: var(--error); }
    .md-row.hr { color: var(--muted); }
    .md-row.blank { color: transparent; }
    .md-row.code {
      background: var(--code-bg);
      color: var(--code-fg);
      padding: 0 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .md-row.code-first {
      padding-top: 8px;
      border-radius: 8px 8px 0 0;
    }
    .md-row.code-last {
      padding-bottom: 8px;
      border-radius: 0 0 8px 8px;
    }
    .md-row.code-single {
      padding-top: 8px;
      padding-bottom: 8px;
      border-radius: 8px;
    }
    .md-row code.inline {
      background: color-mix(in srgb, var(--code-bg) 80%, transparent);
      padding: 0 4px;
      border-radius: 5px;
    }
    .tool-args-wrap { width: 100%; min-width: 0; }
    .tool-args-block {
      margin: 2px 0 0;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-fg);
      border: none;
      overflow: hidden;
    }
    .tool-args-block summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
      padding: 7px 10px;
      color: var(--muted);
      border-bottom: 1px solid transparent;
    }
    .tool-args-block summary::-webkit-details-marker { display: none; }
    .tool-args-block summary::before {
      content: "▸ ";
      color: var(--thinking);
      font-weight: 700;
    }
    .tool-args-block[open] summary {
      border-bottom-color: color-mix(in srgb, var(--btn-bd) 60%, transparent);
    }
    .tool-args-block[open] summary::before { content: "▾ "; }
    .tool-args-block pre {
      margin: 0;
      padding: 8px 10px 10px;
      background: transparent;
      color: var(--code-fg);
      border-radius: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="wrap">
    <div class="controls">
      <input id="promptInput" value="Refactor parser and show progress." />
      <button id="runBtn">Run Success Demo</button>
      <button id="runErrorBtn">Run Error Demo</button>
      <button id="exitBtn">Exit Line</button>
      <button id="resetBtn">Reset</button>
      <button id="themeBtn">Theme: Dark</button>
    </div>
    <div class="terminal" id="terminal"></div>
  </div>

  <script>
    const LANE = "\u2502";
    const TREE_MID = "\u251C\u2500 ";
    const TREE_END = "\u2514\u2500 ";

    const state = {
      theme: "dark",
      turns: [],
      showTerminated: false,
      timer: null
    };

    const banner = `    ___                    __  ______
   /   | ____ ____  ____  / /_/ ____/___  _________ ____
  / /| |/ __ \`/ _ \\/ __ \\/ __/ /_  / __ \\/ ___/ __ \`/ _ \\
 / ___ / /_/ /  __/ / / / /_/ __/ / /_/ / /  / /_/ /  __/
/_/  |_|\\__, /\\___/_/ /_/\\__/_/    \\____/_/   \\__, /\\___/
      /____/                                /____/`;

    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function inlineMarkdown(text) {
      return esc(text).replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
    }

    function markdownLiteRows(src) {
      const lines = src.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      let out = [];
      let inCode = false;
      let codeLines = [];
      let h1PendingBlank = false;

      function pushCodeLines(buffer) {
        const block = buffer.length ? buffer : [""];
        const single = block.length === 1;
        for (let idx = 0; idx < block.length; idx++) {
          const first = idx === 0;
          const last = idx === block.length - 1;
          const cls = [
            "md-row",
            "code",
            single ? "code-single" : "",
            first && !single ? "code-first" : "",
            last && !single ? "code-last" : "",
          ].filter(Boolean).join(" ");
          out.push(`<div class="${cls}">${esc(block[idx]) || "&nbsp;"}</div>`);
        }
      }

      for (const line of lines) {
        if (line.startsWith("```")) {
          if (!inCode) {
            inCode = true;
            codeLines = [];
          } else {
            pushCodeLines(codeLines);
            inCode = false;
            codeLines = [];
          }
          continue;
        }
        if (inCode) {
          codeLines.push(line);
          continue;
        }
        if (h1PendingBlank) {
          out.push(`<div class="md-row blank">&nbsp;</div>`);
          h1PendingBlank = false;
        }
        if (/^###\s+/.test(line)) { out.push(`<div class="md-row h3">${inlineMarkdown(line.replace(/^###\s+/, ""))}</div>`); continue; }
        if (/^##\s+/.test(line))  { out.push(`<div class="md-row h2">${inlineMarkdown(line.replace(/^##\s+/, ""))}</div>`); continue; }
        if (/^#\s+/.test(line))   { out.push(`<div class="md-row h1">${inlineMarkdown(line.replace(/^#\s+/, ""))}</div>`); h1PendingBlank = true; continue; }
        if (/^>\s?/.test(line)) {
          out.push(`<div class="md-row quote"><span class="qbar">${LANE}</span><span>${inlineMarkdown(line.replace(/^>\s?/, ""))}</span></div>`);
          continue;
        }
        if (line.trim() === "---") { out.push('<div class="md-row hr">---</div>'); continue; }
        if (!line.trim()) { out.push('<div class="md-row blank">&nbsp;</div>'); continue; }
        out.push(`<div class="md-row">${inlineMarkdown(line)}</div>`);
      }
      if (inCode) pushCodeLines(codeLines);
      return out;
    }

    function buildToolArgsSource() {
      const docsLong = "This payload intentionally carries a long mixed markdown/html/docs body so the preview can validate wrapping and streaming for large command arguments. ".repeat(5);
      const htmlLong = "<article><h1>Runtime UI Preview</h1><p>The command block should wrap long inline HTML safely without clipping lanes.</p><section><h2>Edge Cases</h2><ul><li>long path</li><li>embedded docs</li><li>json escaping</li></ul></section></article>";
      return JSON.stringify({
        path: "workspace/AGENT.md",
        include: [
          "docs/BLUEPRINT_VI.md",
          "docs/TUTORIAL.md",
          "workspace/skills/system/SKILL_SYSTEM.md"
        ],
        mode: "stream_preview",
        parse_as: "markdown+html",
        max_chars: 24000,
        docs_excerpt: docsLong,
        html_preview: htmlLong
      }, null, 2);
    }

    function statusView(turn) {
      if (turn.status === "error") {
        return { cls: "error", text: `error: ${esc(turn.error || "unknown")}` };
      }
      if (turn.status === "done") {
        return { cls: "success", text: "completed." };
      }
      if (turn.status === "processing") {
        return { cls: "processing", text: "processing..." };
      }
      return { cls: "thinking", text: "thinking..." };
    }

    function turnLaneClass(turn) {
      if (turn.status === "error") return "error";
      if (turn.status === "done") return "success";
      if (turn.status === "thinking") return "thinking";
      return "processing";
    }

    function render() {
      const t = document.getElementById("terminal");
      const html = [];
      html.push(`<pre class="banner">${esc(banner)}</pre>`);
      html.push(`<p class="version">v1.0.1</p>`);
      html.push(`<div class="line"><span class="branch">${LANE} </span><span class="dim">model: qwen3vl-local</span></div>`);
      html.push(`<div class="line"><span class="branch">${LANE} </span><span class="dim">commands: exit | reset | clear | skills | session</span></div>`);

      for (const turn of state.turns) {
        const laneClass = turnLaneClass(turn);
        html.push(`<div class="line"><span class="prompt">&gt; </span><span>${esc(turn.input)}</span></div>`);

        const status = statusView(turn);
        html.push(`<div class="line"><span class="branch ${status.cls}">${TREE_MID}</span><span class="status-text ${status.cls}">${status.text}</span></div>`);

        if (turn.reasoning) {
          html.push(`<div class="line"><span class="branch ${laneClass}">${LANE} </span><span class="dim">${esc(turn.reasoning)}</span></div>`);
        }

        if (turn.output.trim()) {
          html.push(`<div class="line"><span class="branch ${laneClass}">${TREE_MID}</span><span class="agent-label">Agent-01</span></div>`);
          const mdRows = markdownLiteRows(turn.output);
          for (const row of mdRows) {
            html.push(`<div class="line"><span class="branch ${laneClass}">${LANE} </span><div class="md-row-wrap ${laneClass}">${row}</div></div>`);
          }
        }

        if (turn.status === "error" && turn.error.trim() && !turn.output.trim()) {
          html.push(`<div class="line"><span class="branch error">${TREE_MID}</span><span class="error">${esc(turn.error)}</span></div>`);
        }

        if (turn.toolCall) {
          const argsLen = turn.toolCall.args.length;
          const summary = turn.toolCall.streaming
            ? `command payload (streaming... ${argsLen} chars)`
            : `command payload (${argsLen} chars)`;
          html.push(`<div class="line"><span class="branch ${laneClass}">${TREE_MID}</span><span class="tool-label">tool: ${esc(turn.toolCall.name)}</span></div>`);
          html.push(
            `<div class="line"><span class="branch ${laneClass}">${LANE} </span><div class="tool-args-wrap">` +
            `<details class="tool-args-block"><summary>${esc(summary)}</summary><pre>${esc(turn.toolCall.args)}</pre></details>` +
            `</div></div>`
          );
          if (turn.toolCall.done) {
            const resultText = turn.toolCall.success
              ? `result: ${turn.toolCall.name} ok`
              : `result: ${turn.toolCall.name} failed`;
            const resultClass = turn.toolCall.success ? "tool-result" : "error";
            const resultLaneClass = turn.toolCall.success ? laneClass : "error";
            html.push(`<div class="line"><span class="branch ${resultLaneClass}">${TREE_END}</span><span class="${resultClass}">${esc(resultText)}</span></div>`);
          }
        }
      }

      if (state.showTerminated) {
        html.push(`<div class="line"><span class="branch">${TREE_END}</span><span class="dim">session terminated.</span></div>`);
      }

      t.innerHTML = html.join("");
      t.scrollTop = t.scrollHeight;
    }

    function runDemo() {
      startDemo({ scenario: "success" });
    }

    function runErrorDemo() {
      startDemo({ scenario: "error" });
    }

    function startDemo(options) {
      if (state.timer) clearInterval(state.timer);
      const input = document.getElementById("promptInput").value.trim() || "Test streaming output";
      const scenario = (options && options.scenario) || "success";
      const isErrorScenario = scenario === "error";
      const turn = {
        input,
        status: "processing",
        reasoning: "",
        output: "",
        error: "",
        toolCall: null
      };
      state.turns.push(turn);
      state.showTerminated = false;

      const reasoningSource = "Inspecting parser flow, verifying schema, checking edge cases... ";
      const outputSource = `## Plan
We'll patch the parser and keep callbacks stable.

> Streaming markdown is rendered inline.

---

\`\`\`python
def parse(payload: dict) -> dict:
    return {"ok": True, "size": len(payload)}
\`\`\`

Result is ready.`;
      const toolArgsSource = buildToolArgsSource();

      let p = 0;
      let i = 0;
      let j = 0;
      let k = 0;
      state.timer = setInterval(() => {
        if (p < 14) {
          p += 1;
          turn.status = "processing";
          render();
          return;
        }

        if (i < reasoningSource.length) {
          turn.reasoning += reasoningSource[i++];
          turn.status = "thinking";
          render();
          return;
        }

        if (isErrorScenario) {
          turn.status = "error";
          turn.error = "tool execution aborted by runtime timeout.";
          clearInterval(state.timer);
          state.timer = null;
          render();
          return;
        }

        if (j < outputSource.length) {
          turn.output += outputSource[j++];
          turn.status = "thinking";
          render();
          return;
        }

        if (!turn.toolCall) {
          turn.toolCall = {
            name: "read_file",
            args: "",
            streaming: true,
            done: false,
            success: false
          };
          turn.status = "thinking";
          render();
          return;
        }

        if (k < toolArgsSource.length) {
          const chunk = toolArgsSource.slice(k, k + 6);
          k += chunk.length;
          turn.toolCall.args += chunk;
          turn.status = "thinking";
          render();
          return;
        }

        turn.toolCall.streaming = false;
        turn.toolCall.done = true;
        turn.toolCall.success = true;
        turn.status = "done";
        turn.error = "";
        clearInterval(state.timer);
        state.timer = null;
        render();
      }, 18);
    }

    function resetDemo() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      state.turns = [];
      state.showTerminated = false;
      render();
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", state.theme);
      document.getElementById("themeBtn").textContent = `Theme: ${state.theme[0].toUpperCase()}${state.theme.slice(1)}`;
    }

    function showExitLine() {
      state.showTerminated = true;
      render();
    }

    document.getElementById("runBtn").addEventListener("click", runDemo);
    document.getElementById("runErrorBtn").addEventListener("click", runErrorDemo);
    document.getElementById("resetBtn").addEventListener("click", resetDemo);
    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    document.getElementById("exitBtn").addEventListener("click", showExitLine);

    render();
  </script>
</body>
</html>
